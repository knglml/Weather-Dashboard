<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简易天气查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 80px;
            color: #fff;
        }
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
        }
        input {
            padding: 12px 16px;
            width: 280px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #2d3436;
            color: white;
            cursor: pointer;
        }
        .weather-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding: 32px;
            border-radius: 16px;
            min-width: 320px;
            text-align: center;
        }
        .city-name {
            font-size: 28px;
            margin-bottom:12px;
        }
        .temp {
            font-size: 52px;
            font-weight: bold;
            margin:10px 0;
        }
        .desc {
            font-size:18px;
            margin-bottom:15px;
        }
        .info-row {
            display:flex;
            justify-content: space-around;
            margin-top:20px;
        }
    </style>
</head>
<body>
    <div class="search-box">
        <input id="cityInput" placeholder="输入城市名，如Beijing/上海">
        <button id="searchBtn">查询天气</button>
    </div>
    <div class="weather-card" id="card">
        <div class="city-name">--</div>
        <div class="temp">--℃</div>
        <div class="desc">--</div>
        <div class="info-row">
            <div>湿度：<span id="hum">--</span>%</div>
            <div>风速：<span id="wind">--</span> m/s</div>
        </div>
    </div>

    <script>
        const key = "35c45968d89281f74692b832f1a5203b";
        const baseUrl = "https://api.openweathermap.org/data/2.5/weather";
        const input = document.getElementById('cityInput');
        const btn = document.getElementById('searchBtn');

        async function getWeather(city) {
            try {
                let res = await fetch(`${baseUrl}?q=${city}&appid=${key}&units=metric&lang=zh_cn`);
                let data = await res.json();
                if(data.cod !==200){
                    alert("城市不存在");
                    return;
                }
                document.querySelector('.city-name').innerText = data.name;
                document.querySelector('.temp').innerText = `${data.main.temp}℃`;
                document.querySelector('.desc').innerText = data.weather[0].description;
                document.getElementById('hum').innerText = data.main.humidity;
                document.getElementById('wind').innerText = data.wind.speed;
            } catch (err) {
                alert("网络错误");
            }
        }
        btn.onclick = ()=>getWeather(input.value.trim());
        input.onkeydown = e=>{
            if(e.key === 'Enter') getWeather(input.value.trim())
        }
    </script>
</body>
</html>
